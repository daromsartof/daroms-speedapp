<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- Aperçu social (GitHub, og:image) : bun docs/scripts/social-preview.ts -> docs/public/social-preview.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1430"/>
      <stop offset="1" stop-color="#16206a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f7fb"/>
      <stop offset="1" stop-color="#e8ecfa"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1120" cy="80" r="260" fill="#3347FF" opacity="0.18"/>

  <!-- logo -->
  <g transform="translate(96 88) scale(3)">
    <rect width="32" height="32" rx="8" fill="#3347FF"/>
    <path d="M7 21.5a9 9 0 0 1 18 0z" fill="#FFB21E"/>
    <rect x="5" y="23.5" width="22" height="2.5" rx="1.25" fill="#FFFFFF"/>
  </g>

  <g font-family="DejaVu Sans" fill="#ffffff">
    <text x="96" y="282" font-size="72" font-weight="700">Daroms Speed App</text>
    <text x="96" y="348" font-size="36" fill="#c9d1f5">An idea in the morning,</text>
    <text x="96" y="396" font-size="36" fill="#c9d1f5">the app on your phone by evening.</text>
  </g>

  <!-- pile -->
  <g font-family="DejaVu Sans" font-size="22" font-weight="700">
    <rect x="96" y="440" width="96" height="44" rx="22" fill="#ffffff" opacity="0.1"/>
    <text x="144" y="469" text-anchor="middle" fill="#ffffff">Expo</text>
    <rect x="204" y="440" width="132" height="44" rx="22" fill="#ffffff" opacity="0.1"/>
    <text x="270" y="469" text-anchor="middle" fill="#ffffff">Tamagui</text>
    <rect x="348" y="440" width="152" height="44" rx="22" fill="#ffffff" opacity="0.1"/>
    <text x="424" y="469" text-anchor="middle" fill="#ffffff">Supabase</text>
    <rect x="512" y="440" width="306" height="44" rx="22" fill="#FFB21E"/>
    <text x="665" y="469" text-anchor="middle" fill="#0d1430">built for Claude Code</text>
  </g>

  <!-- commande -->
  <rect x="96" y="516" width="684" height="64" rx="14" fill="#060a1c" stroke="#3347FF" stroke-width="2"/>
  <text x="124" y="556" font-family="DejaVu Sans Mono" font-size="24" fill="#ffffff"><tspan fill="#FFB21E">$</tspan> npx @daromsart/daroms-speed-app new my-app</text>

  <!-- téléphone -->
  <g transform="translate(900 92)">
    <rect width="276" height="500" rx="40" fill="#060a1c"/>
    <rect x="14" y="14" width="248" height="472" rx="28" fill="url(#screen)"/>
    <rect x="102" y="26" width="72" height="14" rx="7" fill="#060a1c"/>
    <text x="34" y="92" font-family="DejaVu Sans" font-size="24" font-weight="700" fill="#0d1430">Books</text>
    <g font-family="DejaVu Sans">
      <rect x="30" y="112" width="216" height="64" rx="14" fill="#ffffff"/>
      <rect x="44" y="126" width="36" height="36" rx="10" fill="#3347FF"/>
      <rect x="92" y="130" width="110" height="10" rx="5" fill="#0d1430"/>
      <rect x="92" y="148" width="70" height="8" rx="4" fill="#9aa3c7"/>
      <rect x="30" y="188" width="216" height="64" rx="14" fill="#ffffff"/>
      <rect x="44" y="202" width="36" height="36" rx="10" fill="#FFB21E"/>
      <rect x="92" y="206" width="96" height="10" rx="5" fill="#0d1430"/>
      <rect x="92" y="224" width="84" height="8" rx="4" fill="#9aa3c7"/>
      <rect x="30" y="264" width="216" height="64" rx="14" fill="#ffffff"/>
      <rect x="44" y="278" width="36" height="36" rx="10" fill="#3347FF" opacity="0.55"/>
      <rect x="92" y="282" width="120" height="10" rx="5" fill="#0d1430"/>
      <rect x="92" y="300" width="60" height="8" rx="4" fill="#9aa3c7"/>
      <rect x="30" y="348" width="216" height="80" rx="16" fill="#3347FF"/>
      <text x="48" y="384" font-size="30" font-weight="700" fill="#ffffff">12</text>
      <text x="48" y="410" font-size="14" fill="#dfe4ff">day streak</text>
      <rect x="150" y="372" width="12" height="40" rx="4" fill="#ffffff" opacity="0.5"/>
      <rect x="170" y="384" width="12" height="28" rx="4" fill="#ffffff" opacity="0.5"/>
      <rect x="190" y="364" width="12" height="48" rx="4" fill="#FFB21E"/>
      <rect x="210" y="378" width="12" height="34" rx="4" fill="#ffffff" opacity="0.5"/>
    </g>
    <rect x="30" y="444" width="216" height="2" fill="#d5daf0"/>
    <circle cx="70" cy="464" r="6" fill="#3347FF"/>
    <circle cx="138" cy="464" r="6" fill="#9aa3c7"/>
    <circle cx="206" cy="464" r="6" fill="#9aa3c7"/>
  </g>
</svg>
