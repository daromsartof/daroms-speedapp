# Flow principal (Maestro). Lancer avec `bun daroms e2e` ou `bun daroms e2e --go` : la CLI fournit APP_ID et APP_URL.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- runFlow:
    when:
      true: ${APP_URL}
    commands:
      - openLink: ${APP_URL}
      # Expo Go réaffiche son menu de développement après clearState : le fermer
      - extendedWaitUntil:
          visible: 'Reload'
          timeout: 60000
          optional: true
      - runFlow:
          when:
            visible: 'Reload'
          commands:
            - tapOn:
                point: '90%,45%'
- extendedWaitUntil:
    visible: 'Bienvenue|Welcome'
    timeout: 60000
- takeScreenshot: e2e/screens/home
